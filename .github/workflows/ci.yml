name: CI

# Cheap checks on every PR: PHP syntax (the runner's PHP) and the plugin's JS.
# The plugin has no Composer or npm dependencies, so this is mostly what tests
# Dependabot's GitHub Actions updates: the bumped actions run here.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: PHP syntax
        run: |
          php -v
          git ls-files -z '*.php' | xargs -0 -n1 php -l

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: JS syntax
        run: git ls-files -z '*.js' | xargs -0 -n1 node --check

      - name: Check translations
        run: |
          command -v msgfmt || (sudo apt-get update -qq && sudo apt-get install -y -qq gettext)
          for f in languages/*.po; do msgfmt --check -o /dev/null "$f"; done
